<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ati Documentation — Sign in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbfbfa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1d2422;
      }
      .card {
        width: min(22rem, 90vw);
        background: #ffffff;
        border: 1px solid #e3e7e5;
        border-radius: 0.75rem;
        padding: 2rem;
        box-shadow: 0 8px 24px rgba(20, 35, 31, 0.06);
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 0.35rem;
      }
      p.sub {
        margin: 0 0 1.5rem;
        color: #4d5754;
        font-size: 0.9rem;
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: #4d5754;
        margin-bottom: 0.4rem;
      }
      input[type='password'] {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border: 1px solid #d2d8d5;
        border-radius: 0.5rem;
        font-size: 0.95rem;
        margin-bottom: 1rem;
      }
      button {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border: none;
        border-radius: 0.5rem;
        background: #0f8f87;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #0b6f69;
      }
      .error {
        background: #fdeeec;
        border: 1px solid #f3d2cd;
        color: #b4372c;
        border-radius: 0.5rem;
        padding: 0.6rem 0.75rem;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ati Documentation</h1>
      <p class="sub">Internal knowledge system. Enter the access passphrase to continue.</p>
      <form id="f" method="POST" action="/api/login">
        <div class="error" id="err" style="display: none">That passphrase didn't work. Try again.</div>
        <label for="password">Passphrase</label>
        <input type="password" id="password" name="password" autofocus required />
        <input type="hidden" name="next" id="next" value="/" />
        <button type="submit">Continue</button>
      </form>
    </div>
    <script>
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next');
      if (next) document.getElementById('next').value = next;
      if (params.get('error')) document.getElementById('err').style.display = 'block';
    </script>
  </body>
</html>
